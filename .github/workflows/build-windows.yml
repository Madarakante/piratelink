name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Build unsigned installer and executable
        run: npm run tauri:build
        env:
          NO_COLOR: "1"

      - name: Upload unsigned NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: piratelink-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: piratelink-windows-portable
          path: src-tauri/target/release/piratelink.exe
          if-no-files-found: error
